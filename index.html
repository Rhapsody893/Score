<style>
:root{--bg:#0e0e12;--su:#1a1a22;--s2:#22222e;--ac:#7c6aff;--ac2:#c084fc;--tx:#f0eff8;--t2:#9896b0;--bo:rgba(255,255,255,0.08);--st:#f59e0b;--sp:#34d399;--re:#f87171;--r:12px}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--tx);font-family:system-ui,-apple-system,sans-serif;min-height:100vh;padding:calc(1.25rem + env(safe-area-inset-top)) calc(1rem + env(safe-area-inset-right)) calc(4rem + env(safe-area-inset-bottom)) calc(1rem + env(safe-area-inset-left));-webkit-text-size-adjust:100%;-webkit-tap-highlight-color:transparent}
.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0,0,0,0)}
header{text-align:center;margin-bottom:1.4rem}
h1{font-size:1.3rem;font-weight:700;letter-spacing:-.02em;background:linear-gradient(135deg,var(--ac),var(--ac2));-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;margin-top:.2rem}
.sub{font-size:.76rem;color:var(--t2);margin-top:.2rem;display:flex;align-items:center;justify-content:center;gap:5px}
.dot{width:7px;height:7px;border-radius:50%;background:#555;flex-shrink:0;transition:background .3s}

.tabs{display:flex;gap:4px;background:var(--su);border-radius:var(--r);padding:4px;margin-bottom:1rem}

.btn{font-size:.8rem;padding:.4rem .85rem;border-radius:8px;border:1px solid var(--bo);background:var(--su);color:var(--tx);cursor:pointer;font-family:inherit;transition:all .15s}
.btn:hover{background:var(--s2);border-color:var(--ac);color:var(--ac)}
.btn-p{background:var(--ac);border-color:var(--ac);color:#fff;font-weight:600}
.btn-p:hover{background:#6a58ee;border-color:#6a58ee;color:#fff}
.btn-d{color:var(--re);border-color:rgba(248,113,113,.25)}
.btn-d:hover{background:rgba(248,113,113,.08);border-color:var(--re);color:var(--re)}
.sh{display:flex;align-items:center;justify-content:space-between;margin-bottom:.75rem;gap:8px}
.sh-t{font-size:.88rem;font-weight:600}

.join{padding:1.5rem 1.25rem;text-align:center}

.in{width:100%;background:var(--s2);border:1px solid var(--bo);border-radius:8px;padding:.65rem .75rem;color:var(--tx);font-size:.92rem;outline:none;font-family:inherit;margin-bottom:.75rem}

.watchers{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:.75rem}
.wchip{display:flex;align-items:center;gap:5px;background:var(--su);border:1px solid var(--bo);border-radius:20px;padding:.25rem .65rem;font-size:.74rem;color:var(--t2)}
.wchip.me{border-color:rgba(124,106,255,.35);color:var(--ac2)}
.pc{background:var(--su);border-radius:var(--r);border:1px solid var(--bo);overflow:hidden;transition:border-color .2s}

.pg{display:flex;flex-direction:column;gap:.7rem}
.ph{display:flex;align-items:center;gap:10px;padding:.7rem .85rem;border-bottom:1px solid var(--bo)}
.av{width:33px;height:33px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:.82rem;flex-shrink:0}
.pn{font-weight:600;font-size:.86rem}
.pl{font-size:.65rem;color:var(--t2)}
.ps{font-size:1.4rem;font-weight:800;letter-spacing:-.03em}
.fr-row{padding:.55rem .6rem .65rem}
.fr-row::-webkit-scrollbar{display:none}
.fi{display:grid;grid-template-columns:repeat(5,1fr);gap:5px}
.fr{background:var(--s2);border-radius:6px;border:1px solid var(--bo)}

.fn{text-align:center;font-size:.64rem;color:var(--t2);padding:3px 0;border-bottom:1px solid var(--bo)}
.fb{display:flex;justify-content:center;align-items:center;gap:3px;padding:5px 2px;min-height:32px}
.bl{width:22px;height:22px;border-radius:7px;display:flex;align-items:center;justify-content:center;font-size:.78rem;font-weight:700;background:var(--su);border:1px solid var(--bo);color:var(--t2);flex-shrink:0}
.bl.X{background:rgba(245,158,11,.15);color:var(--st);border-color:rgba(245,158,11,.3)}
.bl.S{background:rgba(52,211,153,.12);color:var(--sp);border-color:rgba(52,211,153,.25)}
.bl.G{color:#444}
.fs{text-align:center;font-size:.82rem;font-weight:600;color:var(--t2);padding:3px 0 1px;min-height:19px}
.fs.done{color:var(--ac);font-weight:600}
.ipad{background:var(--su);border-radius:var(--r);border:1px solid var(--bo);padding:.9rem;margin-bottom:.75rem}
.iw{font-size:.88rem;color:var(--t2);margin-bottom:.7rem}
.iw strong{color:var(--tx)}
.pgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.pb{padding:.5rem .2rem;border-radius:10px;border:1px solid var(--bo);background:var(--s2);color:var(--tx);font-size:1.05rem;font-weight:600;cursor:pointer;text-align:center;font-family:inherit;transition:all .1s}
.pb:hover{border-color:var(--ac);color:var(--ac)}
.pb:active{transform:scale(.95)}
.pb.pX{background:rgba(245,158,11,.1);border-color:rgba(245,158,11,.3);color:var(--st)}
.pb.pS{background:rgba(52,211,153,.1);border-color:rgba(52,211,153,.25);color:var(--sp)}
.pb.p0{color:#555}
.ub{display:flex;align-items:center;justify-content:space-between;gap:.7rem;margin-top:.7rem;padding-top:.7rem;border-top:1px solid var(--bo)}
.ub .btn{flex-shrink:0}
.ul{font-size:.8rem;color:var(--t2)}
.end{background:var(--su);border-radius:var(--r);border:1px solid var(--bo);padding:1.1rem;text-align:center;margin-bottom:.8rem}
.et{font-size:.95rem;font-weight:700;margin-bottom:.2rem}
.es{font-size:.8rem;color:var(--t2);margin-bottom:.85rem}
.list{display:flex;flex-direction:column;gap:6px}
.row{background:var(--su);border-radius:var(--r);padding:.7rem .85rem;display:flex;align-items:center;gap:10px;border:1px solid var(--bo)}
.rank{font-size:.9rem;width:22px;text-align:center}
.rname{flex:1;font-weight:600;font-size:.86rem}
.rsub{font-size:.72rem;color:var(--t2)}
.rscore{font-size:1.15rem;font-weight:800}
.chip{font-size:.63rem;padding:2px 7px;border-radius:20px;background:rgba(245,158,11,.1);color:var(--st);border:1px solid rgba(245,158,11,.25)}
.empty{text-align:center;padding:2rem .75rem;color:var(--t2)}
.ei{font-size:2rem;margin-bottom:.5rem}
.empty p{font-size:.85rem;line-height:1.6}
.ov{position:fixed;inset:0;background:rgba(0,0,0,.75);display:flex;align-items:center;justify-content:center;padding:1rem;z-index:100}
.modal{background:var(--su);border-radius:16px;border:1px solid var(--bo);padding:1.25rem;width:100%;max-width:300px}
.modal h2{font-size:.95rem;font-weight:700;margin-bottom:.85rem}
.ml{display:flex;flex-direction:column;gap:5px;margin-bottom:.85rem;max-height:180px;overflow-y:auto}
.mr{display:flex;align-items:center;gap:8px;background:var(--s2);border-radius:8px;padding:.45rem .6rem}
.mr .pn{flex:1;font-size:.83rem}
.ma{display:flex;gap:8px}
.ma .btn{flex:1}
.err{font-size:.75rem;color:var(--re);margin:-.4rem 0 .6rem}

/* ── native feel ─────────────────────────────────────────── */
html{background:var(--bg);height:100%}
html,body{overscroll-behavior:none}
body{
  -webkit-user-select:none;user-select:none;
  -webkit-touch-callout:none;
  -webkit-tap-highlight-color:transparent;
  touch-action:manipulation;
}
input,textarea{-webkit-user-select:text;user-select:text}
/* room for the tab bar */
body{padding-bottom:max(7.6rem,calc(5.4rem + env(safe-area-inset-bottom)))}
/* every scroller keeps momentum and doesn't drag the page */
.fr-row,.ml{-webkit-overflow-scrolling:touch;overscroll-behavior:contain}

/* ── tab bar ─────────────────────────────────────────────── */
.tabbar{
  position:fixed;left:0;right:0;bottom:0;z-index:50;
  display:flex;
  padding:.3rem calc(.5rem + env(safe-area-inset-left)) max(2.6rem,calc(.45rem + env(safe-area-inset-bottom))) calc(.5rem + env(safe-area-inset-right));
  background:rgba(18,18,24,.82);
  -webkit-backdrop-filter:saturate(180%) blur(20px);
  backdrop-filter:saturate(180%) blur(20px);
  border-top:1px solid var(--bo);
}
.tb{
  flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;
  min-height:54px;padding:.4rem 0;border:none;background:none;cursor:pointer;
  color:var(--t2);font-family:inherit;font-size:.65rem;font-weight:500;
  transition:color .18s;
}
.tb svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.9;
        stroke-linecap:round;stroke-linejoin:round;transition:transform .18s}
.tb[aria-selected="true"]{color:var(--ac2)}
.tb[aria-selected="true"] svg{transform:translateY(-1px) scale(1.06)}
.tb:active svg{transform:scale(.9)}

/* ── touch feedback ──────────────────────────────────────── */
.btn,.pb,.tb{-webkit-user-select:none;user-select:none}
.btn{min-height:44px;padding-left:.9rem;padding-right:.9rem}
.pb{min-height:60px;transition:transform .08s,background .15s,border-color .15s}
.pb:active{transform:scale(.93)}
.btn:active{transform:scale(.96)}
/* pointer devices only: hover shouldn't stick on touch */
@media (hover:none){
  .btn:hover{background:var(--su);border-color:var(--bo);color:var(--tx)}
  .btn-p:hover{background:var(--ac);border-color:var(--ac);color:#fff}
  .pb:hover{border-color:var(--bo);color:var(--tx)}
  .pb.pX:hover{border-color:rgba(245,158,11,.3);color:var(--st)}
  .pb.pS:hover{border-color:rgba(52,211,153,.25);color:var(--sp)}
}

/* ── sheets (bottom-anchored dialogs) ────────────────────── */
.ov{align-items:flex-end;padding:0;opacity:0;transition:opacity .22s}
.ov.in{opacity:1}
.modal{
  max-width:520px;width:100%;
  border-radius:18px 18px 0 0;border-bottom:none;
  padding:1.1rem 1.1rem calc(1.1rem + env(safe-area-inset-bottom));
  transform:translateY(100%);transition:transform .28s cubic-bezier(.32,.72,0,1);
}
.ov.in .modal{transform:translateY(0)}
.grab{width:34px;height:4px;border-radius:2px;background:var(--bo);margin:0 auto .85rem}

/* ── view transition ─────────────────────────────────────── */
#app{animation:fade .22s ease}
@keyframes fade{from{opacity:.4}to{opacity:1}}

@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms !important;transition-duration:.01ms !important}
}
.wlabel{font-size:.82rem;color:var(--t2);margin:.1rem 0 .5rem}
.wgrid{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin-bottom:.75rem}
.wb{min-height:52px;border-radius:10px;border:1px solid var(--bo);background:var(--s2);
    color:var(--tx);font-size:.95rem;font-weight:600;font-family:inherit;cursor:pointer;
    transition:transform .08s,border-color .15s,background .15s}
.wb:active{transform:scale(.93)}
.wb[aria-pressed="true"]{background:rgba(124,106,255,.16);border-color:var(--ac);color:var(--ac2)}
.wtag{font-size:.63rem;color:var(--t2);font-weight:500}
.hrow{display:block;width:100%;text-align:left;background:var(--su);border:1px solid var(--bo);
      border-radius:var(--r);padding:.7rem .85rem;font-family:inherit;cursor:pointer;color:inherit}
.hhead{display:flex;align-items:center;gap:10px}
.hdet{margin-top:.6rem;padding-top:.6rem;border-top:1px solid var(--bo)}
.chev{color:var(--t2);font-size:.7rem;transition:transform .2s;flex-shrink:0}
.chev.open{transform:rotate(90deg)}
.hero{padding:.25rem 0 1.25rem}
.hi{font-size:1.5rem;font-weight:700;letter-spacing:-.02em}
.who{display:flex;align-items:center;gap:8px;margin-top:.3rem}
.whochip{display:inline-flex;align-items:center;gap:6px;background:var(--su);border:1px solid var(--bo);
  border-radius:20px;padding:.3rem .7rem;font-size:.74rem;color:var(--t2);font-family:inherit;cursor:pointer}
.whochip:active{transform:scale(.96)}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:1.1rem}
.stat{background:var(--su);border:1px solid var(--bo);border-radius:var(--r);padding:.7rem .85rem}
.stat .v{font-size:1.5rem;font-weight:800;letter-spacing:-.03em;line-height:1.1}
.stat .k{font-size:.68rem;color:var(--t2);margin-top:.15rem}
.acts{display:flex;flex-direction:column;gap:8px;margin-bottom:1.1rem}
.act{display:flex;align-items:center;gap:12px;width:100%;text-align:left;font-family:inherit;
  background:var(--su);border:1px solid var(--bo);border-radius:var(--r);
  padding:.85rem .9rem;color:var(--tx);cursor:pointer;min-height:56px;
  transition:transform .08s,border-color .15s}
.act:active{transform:scale(.985)}
.act .t{display:block;font-size:.92rem;font-weight:600}
.act .d{display:block;font-size:.72rem;color:var(--t2);margin-top:.1rem}
.act .ic{width:36px;height:36px;border-radius:10px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.act .ic svg{width:19px;height:19px;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.act .go{margin-left:auto;color:var(--t2);font-size:.8rem}
.act.primary{background:var(--ac);border-color:var(--ac)}
.act.primary .t{color:#fff}
.act.primary .d{color:rgba(255,255,255,.72)}
.act.primary .ic{background:rgba(255,255,255,.16);color:#fff}
.act.primary .go{color:rgba(255,255,255,.7)}
.act.resume{border-color:rgba(52,211,153,.35)}
.act.resume .ic{background:rgba(52,211,153,.14);color:var(--sp)}
.act .ic.n{background:var(--s2);color:var(--t2)}
.minor{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.mi{display:flex;flex-direction:column;align-items:center;gap:5px;background:var(--su);
  border:1px solid var(--bo);border-radius:var(--r);padding:.75rem .35rem;color:var(--t2);
  font-family:inherit;font-size:.7rem;font-weight:500;cursor:pointer;min-height:64px;justify-content:center}
.mi:active{transform:scale(.96)}
.mi svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.back{display:flex;align-items:center;justify-content:center;width:44px;height:44px;flex-shrink:0;margin-left:-.35rem;
  border-radius:9px;border:1px solid var(--bo);background:var(--su);color:var(--tx);cursor:pointer;font-family:inherit}
.back:active{transform:scale(.93)}
.back svg{width:19px;height:19px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.tb{position:relative}
.badge{position:absolute;top:.15rem;left:calc(50% + 6px);min-width:16px;height:16px;padding:0 4px;
  border-radius:8px;background:var(--re);color:#fff;font-size:.6rem;font-weight:700;
  display:flex;align-items:center;justify-content:center;line-height:1}
.chat{display:flex;flex-direction:column;gap:8px;padding-bottom:.5rem}
.msg{max-width:82%;padding:.5rem .7rem;border-radius:14px;font-size:.86rem;line-height:1.4;
  word-break:break-word;white-space:pre-wrap}
.msg.them{align-self:flex-start;background:var(--su);border:1px solid var(--bo);border-bottom-left-radius:5px}
.msg.me{align-self:flex-end;background:var(--ac);color:#fff;border-bottom-right-radius:5px}
.msg .who{font-size:.68rem;font-weight:700;margin-bottom:.15rem}
.msg .at{font-size:.62rem;opacity:.6;margin-top:.2rem;text-align:right}
.daysep{align-self:center;font-size:.66rem;color:var(--t2);padding:.15rem .6rem;
  background:var(--su);border:1px solid var(--bo);border-radius:20px;margin:.35rem 0}
.composer{position:fixed;left:0;right:0;z-index:49;
  bottom:max(6.7rem,calc(4.5rem + env(safe-area-inset-bottom)));
  display:flex;gap:6px;align-items:flex-end;
  padding:.5rem calc(.75rem + env(safe-area-inset-left)) .5rem calc(.75rem + env(safe-area-inset-right));
  background:rgba(18,18,24,.92);-webkit-backdrop-filter:blur(18px);backdrop-filter:blur(18px);
  border-top:1px solid var(--bo)}
.composer textarea{flex:1;resize:none;background:var(--s2);border:1px solid var(--bo);border-radius:18px;
  padding:.55rem .8rem;color:var(--tx);font-size:.88rem;font-family:inherit;outline:none;
  max-height:100px;min-height:38px;line-height:1.35}
.composer textarea:focus{border-color:var(--ac)}
.send{width:46px;height:46px;flex-shrink:0;border-radius:50%;border:none;background:var(--ac);
  color:#fff;cursor:pointer;display:flex;align-items:center;justify-content:center;font-family:inherit}
.send:disabled{opacity:.35}
.send:active{transform:scale(.92)}
.send svg{width:19px;height:19px;stroke:currentColor;fill:none;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
body.chatting{padding-bottom:max(11.1rem,calc(8.5rem + env(safe-area-inset-bottom)))}

.toast.show{transform:translateX(-50%) translateY(0);opacity:1;visibility:visible}
.sb{background:var(--su);border:1px solid var(--bo);border-radius:var(--r);padding:.6rem .8rem;display:flex;align-items:center;gap:8px;font-size:.76rem;color:var(--t2)}
.sb b{color:var(--tx);font-weight:600;font-family:ui-monospace,monospace;letter-spacing:.04em}
.sb .btn{padding:.28rem .6rem;font-size:.72rem;margin-left:auto;flex-shrink:0}
.note{font-size:.74rem;color:var(--t2);text-align:center;padding:.85rem;line-height:1.5}
</style>
</head>

<div class="toast" id="toast"></div>

<script>
const PAL=[{bg:'rgba(124,106,255,.18)',c:'#a78bfa'},{bg:'rgba(52,211,153,.15)',c:'#34d399'},{bg:'rgba(245,158,11,.15)',c:'#fbbf24'},{bg:'rgba(248,113,113,.15)',c:'#f87171'},{bg:'rgba(192,132,252,.15)',c:'#c084fc'},{bg:'rgba(56,189,248,.15)',c:'#38bdf8'}];

// ── local view state ──────────────────────────────────────
var db=null,room=null;
var G=null;                 // game doc body, or null until first snapshot
var HIST=[];                // history entries
var TAB='game';
var NAV='home';   // 'home' oppure la sezione aperta
var MYNAME=null;
var PEERS=[];               // [{peer,name,isMe}]
var DBREADY=false;
var SEEDED=false;

function esc(s){return String(s).replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}

// ── bowling logic ─────────────────────────────────────────
function emptyFrames(){var a=[];for(var i=0;i<10;i++)a.push({balls:[]});return a}

function availablePins(f,fi,bi){
  var b=f[fi].balls;
  if(fi<9)return bi===0?10:10-b[0];
  if(bi===0)return 10;
  if(bi===1)return b[0]===10?10:10-b[0];
  if(bi===2){
    if(b[0]===10&&b[1]===10)return 10;
    if(b[0]===10)return 10-b[1];
    return 10;
  }
  return 0;
}
function tenthDone(b){
  if(b.length<2)return false;
  if(b[0]===10||b[0]+b[1]===10)return b.length>=3;
  return true;
}
// skip = quanti tiri del frame corrente ignorare:
// 1 dopo uno strike, 2 dopo uno spare (i suoi due tiri non sono il bonus)
function nextDel(f,fi,off,skip){
  var c=0;
  for(var i=fi;i<10;i++){
    var s=(i===fi)?skip:0;
    for(var j=s;j<f[i].balls.length;j++){c++;if(c===off)return f[i].balls[j]}
  }
  return null;
}
function scores(f){
  var out=[],t=0;
  for(var i=0;i<10;i++){
    var b=f[i].balls;out[i]=null;
    if(!b.length)continue;
    if(i<9){
      if(b[0]===10){
        var a=nextDel(f,i,1,1),c=nextDel(f,i,2,1);
        if(a===null||c===null)continue;
        t+=10+a+c;out[i]=t;
      }else if(b.length>=2&&b[0]+b[1]===10){
        var d=nextDel(f,i,1,2);if(d===null)continue;
        t+=10+d;out[i]=t;
      }else if(b.length>=2){t+=b[0]+b[1];out[i]=t}
    }else{
      if(b.length<2)continue;
      if((b[0]===10||b[0]+b[1]===10)&&b.length<3)continue;
      t+=b.reduce(function(x,y){return x+y},0);out[i]=t;
    }
  }
  return out;
}
function total(f){var s=scores(f);for(var i=9;i>=0;i--)if(s[i]!==null)return s[i];return 0}
function label(f,fi,bi){
  var b=f[fi].balls,v=b[bi];
  if(v===undefined)return'';
  if(fi<9){
    if(bi===0)return v===10?'X':(v===0?'—':''+v);
    return b[0]+v===10?'/':(v===0?'—':''+v);
  }
  if(bi===0)return v===10?'X':(v===0?'—':''+v);
  if(bi===1){
    if(b[0]===10)return v===10?'X':(v===0?'—':''+v);
    return b[0]+v===10?'/':(v===0?'—':''+v);
  }
  if(v===10)return'X';
  if(b[0]===10&&b[1]!==10&&b[1]+v===10)return'/';
  return v===0?'—':''+v;
}
function blcls(l){return l==='X'?'bl X':l==='/'?'bl S':l==='—'?'bl G':'bl'}

// ── db writes ─────────────────────────────────────────────
var writing=false;
function writeGame(g){
  if(!db||writing)return Promise.resolve();
  writing=true;
  return db.doc('game/state').set(g).catch(function(e){
    showToast(e&&e.code==='quota_exceeded'?'Spazio esaurito':'Salvataggio non riuscito');
  }).then(function(){writing=false});
}
function writeHist(entries){
  if(!db)return Promise.resolve();
  return db.doc('game/history').set({entries:entries}).catch(function(){
    showToast('Storico non salvato');
  });
}

// ── actions ───────────────────────────────────────────────
function blankGame(players){
  return{players:players||[],activePlayer:0,activeFrame:0,ballInFrame:0,undos:[],finished:false,date:new Date().toLocaleDateString('it-IT')};
}
async function newGame(){
  if(!G||!G.players.length){openModal();return}
  if(!G.finished&&(G.activeFrame>0||G.ballInFrame>0)){
    var ok=await ask('Nuova partita','La partita in corso verr\u00e0 persa.','Ricomincia',true);
    if(!ok)return;
  }
  var ps=G.players.map(function(p,i){return{name:p.name,weight:p.weight||null,colorIdx:i,frames:emptyFrames()}});
  writeGame(blankGame(ps));
}
function recordBall(pins){
  if(!G||G.finished)return;
  var g=JSON.parse(JSON.stringify(G));
  if(!g.undos)g.undos=[];
  g.undos.push({ap:g.activePlayer,af:g.activeFrame,bf:g.ballInFrame,
                frames:JSON.parse(JSON.stringify(g.players[g.activePlayer].frames))});
  // una partita intera sta abbondantemente in 60 passi
  if(g.undos.length>60)g.undos.shift();
  var p=g.players[g.activePlayer];
  p.frames[g.activeFrame].balls.push(pins);
  // advance
  var f=p.frames[g.activeFrame],done;
  if(g.activeFrame<9)done=(f.balls[0]===10)||f.balls.length>=2;
  else done=tenthDone(f.balls);
  if(done){
    g.ballInFrame=0;g.activePlayer++;
    if(g.activePlayer>=g.players.length){g.activePlayer=0;g.activeFrame++}
  }else g.ballInFrame++;
  if(g.activeFrame>=10){
    g.activeFrame=9;g.finished=true;
    var h=HIST.slice();
    g.players.forEach(function(pl){
      var sc=total(pl.frames);
      h.push({date:g.date,name:pl.name,colorIdx:pl.colorIdx,score:sc,perfect:sc===300,
              weight:pl.weight||null,
              frames:pl.frames.map(function(f){return{balls:f.balls.slice()}})});
    });
    if(h.length>120)h=h.slice(h.length-120);
    writeHist(h);
  }
  writeGame(g);
}
function undoLast(){
  if(!G||!G.undos||!G.undos.length)return;
  var g=JSON.parse(JSON.stringify(G));
  var u=g.undos.pop();
  g.players[u.ap].frames=u.frames;
  g.activePlayer=u.ap;g.activeFrame=u.af;g.ballInFrame=u.bf;
  g.finished=false;
  writeGame(g);
}
var PICKED_W=null;
function renderWeights(){
  var g=document.getElementById('wgrid');
  if(!g)return;
  var opts=[8,9,10,11,12,13,14,15,16];
  g.innerHTML=opts.map(function(w){
    return'<button class="wb" data-w="'+w+'" aria-pressed="'+(PICKED_W===w)+'">'+w+'</button>';
  }).join('');
  Array.prototype.forEach.call(g.querySelectorAll('[data-w]'),function(b){
    b.onclick=function(){
      PICKED_W=+b.getAttribute('data-w');tap();
      var e=document.getElementById('pi-err');if(e)e.style.display='none';
      renderWeights();
    };
  });
}
function addPlayer(){
  var el=document.getElementById('pi'),err=document.getElementById('pi-err');
  var name=el.value.trim();
  if(!name){err.textContent='Scrivi un nome';err.style.display='';return}
  if(!PICKED_W){err.textContent='Scegli il peso della palla';err.style.display='';return}
  if(G&&G.players.some(function(p){return p.name.toLowerCase()===name.toLowerCase()})){
    err.textContent='Nome già in uso';err.style.display='';return;
  }
  if(G&&G.players.length>=6){err.textContent='Massimo 6 giocatori';err.style.display='';return}
  err.style.display='none';
  var g=G?JSON.parse(JSON.stringify(G)):blankGame([]);
  g.players.push({name:name,weight:PICKED_W,colorIdx:g.players.length,frames:emptyFrames()});
  if(!g.finished&&g.activeFrame===0&&g.ballInFrame===0)g.undos=[];
  el.value='';PICKED_W=null;renderWeights();
  writeGame(g).then(function(){showToast(name+' aggiunto')});
}
function removePlayer(i){
  if(!G)return;
  if(!G.finished&&(G.activeFrame>0||G.ballInFrame>0)){showToast('Finisci la partita prima');return}
  var g=JSON.parse(JSON.stringify(G));
  var gone=g.players.splice(i,1)[0];
  g.players.forEach(function(p,j){p.colorIdx=j});
  if(g.activePlayer>=g.players.length)g.activePlayer=0;
  writeGame(g).then(function(){showToast(gone.name+' rimosso')});
}
async function clearHist(){
  var ok=await ask('Cancellare lo storico','Tutte le partite registrate verranno eliminate.','Cancella',true);
  if(ok)writeHist([]);
}
var JOIN_W=null;
function renderJoinWeights(){
  var g=document.getElementById('jwgrid');
  if(!g)return;
  g.innerHTML=[8,9,10,11,12,13,14,15,16].map(function(w){
    return'<button class="wb" data-jw="'+w+'" aria-pressed="'+(JOIN_W===w)+'">'+w+'</button>';
  }).join('');
  Array.prototype.forEach.call(g.querySelectorAll('[data-jw]'),function(b){
    b.onclick=function(){
      JOIN_W=+b.getAttribute('data-jw');tap();
      var e=document.getElementById('join-err');if(e)e.style.display='none';
      renderJoinWeights();
    };
  });
}
function joinAs(){
  var el=document.getElementById('joinin'),err=document.getElementById('join-err');
  var n=el.value.trim();
  if(!n){err.textContent='Scrivi il tuo nome';err.style.display='';return}
  if(!JOIN_W){err.textContent='Scegli il peso della palla';err.style.display='';return}
  MYNAME=n;
  try{localStorage.setItem('score_name',n)}catch(e){}
  NAV='home';
  var g=G?JSON.parse(JSON.stringify(G)):blankGame([]);
  if(!g.players)g.players=[];
  var mine=null;
  g.players.forEach(function(p){if(p.name.toLowerCase()===n.toLowerCase())mine=p});
  if(mine)mine.weight=JOIN_W;
  else if(g.players.length<6)
    g.players.push({name:n,weight:JOIN_W,colorIdx:g.players.length,frames:emptyFrames()});
  writeGame(g);
  render();
}

// ── render ────────────────────────────────────────────────
function render(){
  var app=document.getElementById('app');
  var onHome=!MYNAME||NAV==='home';
  document.body.classList.toggle('home',onHome);
  // la barra resta sempre visibile: la prima scheda riporta alla home
  document.getElementById('tabbar').style.display=MYNAME?'':'none';
  var sb=document.getElementById('syncbar');
  if(sb&&sb.dataset&&sb.dataset.ready)sb.style.display=onHome?'':'none';
  document.body.classList.toggle('chatting',NAV==='chat');
  if(NAV==='chat')markSeen();
  app.innerHTML=(!MYNAME||NAV==='home'||NAV==='game')?gameHTML():
    (NAV==='lb'?lbHTML():NAV==='chat'?chatHTML():histHTML());
  paintBadge();
  wire();
}
function watchersHTML(){
  if(!PEERS.length)return'';
  return'<div class="watchers">'+PEERS.map(function(p){
    return'<div class="wchip'+(p.isMe?' me':'')+'"><span class="dot on"></span>'+esc(p.name)+(p.isMe?' (tu)':'')+'</div>';
  }).join('')+'</div>';
}
function gameHTML(){
  if(!G)return'<div class="empty"><div class="ei">🎳</div><p>Caricamento della partita…</p></div>';
  if(!MYNAME){
    return'<div class="card join"><div class="join-t">Chi sei?</div>'+
      '<div class="join-s">Il tuo nome e la palla che usi.<br>Entri subito in partita come giocatore.</div>'+
      '<input class="in" id="joinin" placeholder="Il tuo nome" maxlength="18" style="text-align:center">'+
      '<div class="wlabel" style="text-align:center">Peso della palla</div>'+
      '<div class="wgrid" id="jwgrid"></div>'+
      '<div class="err" id="join-err" style="display:none"></div>'+
      '<button class="btn btn-p" id="joinbtn" style="width:100%;padding:.85rem;font-size:1rem">Entra</button></div>';
  }
  if(NAV==='home')return homeHTML();
  var h='<div class="sh">'+backBtn()+'<span class="sh-t" style="flex:1">'+(G.finished?'Partita conclusa':G.players.length?'Partita in corso':'Partita')+'</span><div style="display:flex;gap:5px"><button class="btn" id="bplayers">Giocatori</button><button class="btn btn-p" id="bnew">Nuova</button></div></div>';
  if(!G.players.length)return h+'<div class="empty"><div class="ei">🎳</div><p>Aggiungi i giocatori<br>e inizia la prima partita!</p></div>';
  if(G.finished){
    var rk=G.players.slice().sort(function(a,b){return total(b.frames)-total(a.frames)});
    var w=rk[0],c=PAL[w.colorIdx%6];
    h+='<div class="end"><div class="et">🏆 '+esc(w.name)+' vince!</div><div class="es">Punteggio <strong style="color:'+c.c+'">'+total(w.frames)+'</strong></div><button class="btn btn-p" id="bnew2" style="padding:.7rem 1.4rem">Nuova partita</button></div>';
  }else{
    var ap=G.players[G.activePlayer],fi=G.activeFrame,bi=G.ballInFrame;
    var max=availablePins(ap.frames,fi,bi),c2=PAL[ap.colorIdx%6];
    var tb=ap.frames[9].balls;
    var fresh=bi===0||(fi===9&&bi===1&&tb[0]===10)||(fi===9&&bi===2&&tb[0]===10&&tb[1]===10);
    h+='<div class="ipad"><div class="iw">Tocca a <strong style="color:'+c2.c+'">'+esc(ap.name)+'</strong> — frame '+(fi+1)+', tiro '+(bi+1)+'</div><div class="pgrid">';
    if(fresh){
      h+='<button class="pb pX" style="grid-column:span 2" data-pin="10">Strike X</button>';
      for(var i=9;i>=1;i--)h+='<button class="pb" data-pin="'+i+'">'+i+'</button>';
    }else{
      if(max>0)h+='<button class="pb pS" style="grid-column:span 2" data-pin="'+max+'">Spare /</button>';
      for(var j=max-1;j>=1;j--)h+='<button class="pb" data-pin="'+j+'">'+j+'</button>';
    }
    h+='<button class="pb p0" data-pin="0">— 0</button></div>';
    if(G.undos&&G.undos.length)h+='<div class="ub"><span class="ul">Puoi tornare indietro di '+G.undos.length+(G.undos.length===1?' tiro':' tiri')+'</span><button class="btn" id="bundo">↩ Annulla</button></div>';
    h+='</div>';
  }
  h+='<div class="pg">';
  G.players.forEach(function(p,pi){
    var c=PAL[p.colorIdx%6];
    var ini=p.name.split(' ').map(function(w){return w[0]}).join('').slice(0,2).toUpperCase();
    var act=!G.finished&&pi===G.activePlayer;
    var sc=scores(p.frames);
    var wt=p.weight?'<span class="wtag"> · '+p.weight+' lb</span>':'';
    h+='<div class="pc'+(act?' ac':'')+'"><div class="ph"><div class="av" style="background:'+c.bg+';color:'+c.c+'">'+esc(ini)+'</div>'+
       '<div style="flex:1"><div class="pn">'+esc(p.name)+(act?' ▶':'')+'</div><div class="pl">punteggio'+wt+'</div></div>'+
       '<div class="ps" style="color:'+c.c+'">'+total(p.frames)+'</div></div>'+framesHTML(p.frames);
    h+='</div>';
  });
  return h+'</div>';
}
var CHAT=[];          // messaggi, dal piu vecchio al piu recente
var CHAT_ON=false;    // vero solo se la sincronizzazione e attiva
var CHAT_SEND=null;   // funzione fornita dal livello di sincronizzazione
var CHAT_SEEN=0;
try{CHAT_SEEN=+(localStorage.getItem('score_seen')||0)}catch(e){}

function unread(){
  if(!CHAT_ON)return 0;
  var n=0;
  CHAT.forEach(function(m){if(m.at>CHAT_SEEN&&m.name!==MYNAME)n++});
  return n;
}
function markSeen(){
  var last=CHAT.length?CHAT[CHAT.length-1].at:0;
  if(last>CHAT_SEEN){CHAT_SEEN=last;try{localStorage.setItem('score_seen',String(last))}catch(e){}}
}
function paintBadge(){
  var t=document.getElementById('tabchat');
  if(!t)return;
  t.style.display=CHAT_ON?'':'none';
  var b=t.querySelector('.badge');
  var n=(NAV==='chat')?0:unread();
  if(n>0){
    if(!b){b=document.createElement('span');b.className='badge';t.appendChild(b)}
    b.textContent=n>9?'9+':String(n);
  }else if(b)b.remove();
}
function hhmm(ts){
  var d=new Date(ts);
  return('0'+d.getHours()).slice(-2)+':'+('0'+d.getMinutes()).slice(-2);
}
function dayOf(ts){return new Date(ts).toLocaleDateString('it-IT')}

function chatHTML(){
  var h='<div class="sh"><span class="sh-t">Chat</span></div>';
  if(!CHAT.length)
    h+='<div class="empty"><div class="ei">\ud83d\udcac</div><p>Nessun messaggio.<br>Scrivi qualcosa ai tuoi compagni.</p></div>';
  else{
    h+='<div class="chat">';
    var prevDay=null;
    CHAT.forEach(function(m){
      var d=dayOf(m.at);
      if(d!==prevDay){h+='<div class="daysep">'+esc(d)+'</div>';prevDay=d}
      var mine=m.name===MYNAME;
      h+='<div class="msg '+(mine?'me':'them')+'">'+
         (mine?'':'<div class="who" style="color:var(--ac2)">'+esc(m.name)+'</div>')+
         esc(m.text)+
         '<div class="at">'+hhmm(m.at)+'</div></div>';
    });
    h+='</div>';
  }
  h+='<div class="composer">'+
     '<textarea id="cin" rows="1" placeholder="Messaggio" maxlength="300"></textarea>'+
     '<button class="send" id="csend" disabled aria-label="Invia">'+
     '<svg viewBox="0 0 24 24"><path d="M5 12h13"/><path d="M12 5l7 7-7 7"/></svg></button></div>';
  return h;
}
function myStats(){
  var mine=HIST.filter(function(e){return e.name===MYNAME});
  if(!mine.length)return{avg:null,best:null,n:0};
  var sc=mine.map(function(e){return e.score});
  return{avg:Math.round(sc.reduce(function(a,b){return a+b},0)/sc.length),
         best:Math.max.apply(null,sc),n:sc.length};
}
function myWeight(){
  var me=(G&&G.players||[]).filter(function(p){return p.name===MYNAME})[0];
  return me&&me.weight||null;
}
function ICON(d){return'<svg viewBox="0 0 24 24">'+d+'</svg>'}
var I_PLAY='<path d="M7 5l11 7-11 7z"/>',
    I_PLUS='<path d="M12 5v14"/><path d="M5 12h14"/>',
    I_BARS='<path d="M6 21V9"/><path d="M12 21V4"/><path d="M18 21v-7"/>',
    I_CLOCK='<path d="M12 7v5l3 2"/><circle cx="12" cy="12" r="8"/>',
    I_USERS='<circle cx="9" cy="8" r="3.2"/><path d="M3 20c0-3.3 2.7-5 6-5s6 1.7 6 5"/><path d="M16 5.5a3.2 3.2 0 0 1 0 6"/><path d="M18 15c2 .6 3 2.2 3 5"/>',
    I_BACK='<path d="M15 6l-6 6 6 6"/>';

function homeHTML(){
  var st=myStats(),w=myWeight();
  var players=(G&&G.players)||[];
  var started=G&&!G.finished&&(G.activeFrame>0||G.ballInFrame>0);
  var h='<div class="hero"><div class="hi">Ciao '+esc(MYNAME)+'</div>'+
    '<div class="who"><button class="whochip" id="hedit">'+
    (w?w+' lb':'peso non impostato')+' \u00b7 modifica</button></div></div>';

  h+='<div class="stats">'+
     '<div class="stat"><div class="v" style="color:var(--ac2)">'+(st.avg!==null?st.avg:'\u2014')+'</div><div class="k">media su '+st.n+' partite</div></div>'+
     '<div class="stat"><div class="v" style="color:var(--st)">'+(st.best!==null?st.best:'\u2014')+'</div><div class="k">record personale</div></div>'+
     '</div>';

  h+='<div class="acts">';
  if(started){
    var turn=G.players[G.activePlayer];
    h+='<button class="act resume" data-go="game"><span class="ic">'+ICON(I_PLAY)+'</span>'+
       '<span><span class="t">Riprendi partita</span><span class="d">Frame '+(G.activeFrame+1)+' \u00b7 tocca a '+esc(turn.name)+'</span></span>'+
       '<span class="go">\u203a</span></button>';
  }
  h+='<button class="act primary" id="hnew"><span class="ic">'+ICON(I_PLUS)+'</span>'+
     '<span><span class="t">Nuova partita</span><span class="d">'+
     (players.length?players.length+(players.length===1?' giocatore':' giocatori'):'Aggiungi i giocatori')+
     '</span></span><span class="go">\u203a</span></button>';
  h+='</div>';

  h+='<div class="minor">'+
     '<button class="mi" data-go="lb">'+ICON(I_BARS)+'<span>Classifica</span></button>'+
     '<button class="mi" data-go="hist">'+ICON(I_CLOCK)+'<span>Storico</span></button>'+
     '<button class="mi" id="hplayers">'+ICON(I_USERS)+'<span>Giocatori</span></button>'+

function backBtn(){return'<button class="back" id="bback" aria-label="Torna alla home">'+ICON(I_BACK)+'</button>'}
function framesHTML(frames,compact){
  var sc=scores(frames),h='<div class="fr-row"><div class="fi">';
  for(var f=0;f<10;f++){
    var last=f===9;
    h+='<div class="fr"><div class="fn">'+(f+1)+'</div><div class="fb">';

      var l0=label(frames,f,0),l1=label(frames,f,1);

    }
    h+='</div><div class="fs'+(sc[f]!==null?' done':'')+'">'+(sc[f]!==null?sc[f]:'')+'</div></div>';

function lbHTML(){
  var h='<div class="sh"><span class="sh-t">Classifica</span></div>';
  if(!HIST.length)return h+'<div class="empty"><div class="ei">\ud83c\udfc6</div><p>Nessuna partita conclusa.<br>La classifica si riempie da sola.</p></div>';
  var by={};
  HIST.forEach(function(e){
    if(!by[e.name])by[e.name]={name:e.name,colorIdx:e.colorIdx||0,scores:[],weights:[]};
    by[e.name].scores.push(e.score);
    if(e.weight)by[e.name].weights.push(e.weight);
  });
  var rk=Object.keys(by).map(function(k){
    var v=by[k],sc=v.scores;
    var w=null;
    if(v.weights.length){
      var cnt={},top=0;
      v.weights.forEach(function(x){cnt[x]=(cnt[x]||0)+1;if(cnt[x]>top){top=cnt[x];w=x}});
    }
    return{name:v.name,colorIdx:v.colorIdx,
      best:Math.max.apply(null,sc),
      avg:Math.round(sc.reduce(function(a,b){return a+b},0)/sc.length),
      n:sc.length,weight:w};
  }).sort(function(a,b){return b.avg-a.avg});
  h+='<div class="list">';
  rk.forEach(function(p,i){
    var c=PAL[p.colorIdx%6];
    var ini=p.name.split(' ').map(function(w){return w[0]}).join('').slice(0,2).toUpperCase();
    var m=['\ud83e\udd47','\ud83e\udd48','\ud83e\udd49'][i]||(i+1);
    h+='<div class="row"><div class="rank">'+m+'</div>'+
       '<div class="av" style="width:30px;height:30px;font-size:.74rem;background:'+c.bg+';color:'+c.c+'">'+esc(ini)+'</div>'+
       '<div style="flex:1"><div class="rname">'+esc(p.name)+'</div>'+
       '<div class="rsub">'+p.n+' partite \u00b7 record '+p.best+(p.weight?' \u00b7 '+p.weight+' lb':'')+'</div></div>'+
       '<div style="text-align:right"><div class="rscore" style="color:'+c.c+'">'+p.avg+'</div>'+
       '<div class="rsub" style="font-size:.66rem">media</div></div></div>';
  });
  return h+'</div>';
}
var OPEN_H=null;

function renderML(){

function wire(){

  Array.prototype.forEach.call(app.querySelectorAll('[data-tab]'),function(b){
    b.onclick=function(){TAB=b.getAttribute('data-tab');render()};
  });
  Array.prototype.forEach.call(app.querySelectorAll('[data-pin]'),function(b){
    b.onclick=function(){var v=+b.getAttribute('data-pin');tap(v===10?18:8);recordBall(v)};
  });
  var g=function(id){return document.getElementById(id)};
  if(g('bplayers'))g('bplayers').onclick=openModal;
  if(g('bnew'))g('bnew').onclick=newGame;
  if(g('bnew2'))g('bnew2').onclick=newGame;
  if(g('bundo'))g('bundo').onclick=undoLast;
  if(g('bclear'))g('bclear').onclick=clearHist;
  if(g('cin')){
    var ta=g('cin'),sb=g('csend');
    function grow(){ta.style.height='auto';ta.style.height=Math.min(ta.scrollHeight,100)+'px'}
    function sync(){sb.disabled=!ta.value.trim()}
    ta.oninput=function(){grow();sync()};
    function fire(){
      var t=ta.value.trim();
      if(!t||!CHAT_SEND)return;
      ta.value='';grow();sync();tap();
      CHAT_SEND(t);
    }
    sb.onclick=fire;
    ta.onkeydown=function(e){
      if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();fire()}
    };
    sync();
    var box=document.querySelector('.chat');
    if(box)window.scrollTo(0,document.body.scrollHeight);
  }
  Array.prototype.forEach.call(app.querySelectorAll('[data-h]'),function(b){
    b.onclick=function(){
      var i=+b.getAttribute('data-h');
      OPEN_H=(OPEN_H===i)?null:i;tap();render();
    };
  });
  if(g('joinbtn'))g('joinbtn').onclick=joinAs;
  if(g('jwgrid'))renderJoinWeights();
  if(g('bback'))g('bback').onclick=function(){NAV='home';tap();render();window.scrollTo(0,0)};
  if(g('hedit'))g('hedit').onclick=function(){tap();openModal()};
  if(g('hplayers'))g('hplayers').onclick=function(){tap();openModal()};
  if(g('hnew'))g('hnew').onclick=function(){tap();goto('game');newGame()};
  Array.prototype.forEach.call(app.querySelectorAll('[data-go]'),function(b){
    b.onclick=function(){tap();goto(b.getAttribute('data-go'))};
  });
  if(g('joinin')){
    g('joinin').focus();
    g('joinin').onkeydown=function(e){if(e.key==='Enter')joinAs()};
    g('joinin').oninput=function(){var e=g('join-err');if(e)e.style.display='none'};
  }
}

// -- tocco: micro-vibrazione dove il sistema la supporta ----
function tap(ms){try{if(navigator.vibrate)navigator.vibrate(ms||8)}catch(e){}}

function goto(t){
  NAV=t;
  if(t!=='home')TAB=t;

  var lit=(t==='game')?'home':t;

// -- fogli: apertura e chiusura animate ---------------------
function openSheet(el){
  el.style.display='flex';
  requestAnimationFrame(function(){el.classList.add('in')});
}
function closeSheet(el,then){
  el.classList.remove('in');
  setTimeout(function(){el.style.display='none';if(then)then()},280);
}

// -- conferma in stile foglio, al posto di confirm() --------
function ask(title,msg,okLabel,danger){
  return new Promise(function(resolve){
    var ov=document.createElement('div');
    ov.className='ov';
    ov.innerHTML='<div class="modal"><div class="grab"></div>'+
      '<h2>'+title+'</h2>'+
      '<p style="font-size:.84rem;color:var(--t2);line-height:1.5;margin-bottom:1rem">'+msg+'</p>'+
      '<div class="ma"><button class="btn" data-no>Annulla</button>'+
      '<button class="btn '+(danger?'btn-d':'btn-p')+'" data-yes>'+okLabel+'</button></div></div>';
    document.body.appendChild(ov);
    function done(v){
      closeSheet(ov,function(){ov.remove()});
      resolve(v);
    }
    ov.querySelector('[data-no]').onclick=function(){tap();done(false)};
    ov.querySelector('[data-yes]').onclick=function(){tap(12);done(true)};
    ov.onclick=function(e){if(e.target===ov)done(false)};
    openSheet(ov);
  });
}

var tt;
function showToast(m){var e=document.getElementById('toast');e.textContent=m;e.classList.add('show');clearTimeout(tt);tt=setTimeout(function(){e.classList.remove('show')},2500)}
function setConn(on,txt){document.getElementById('cdot').className='dot'+(on?' on':'');document.getElementById('ctxt').textContent=txt}

// -- local storage layer -----------------------------------
var KEY='score_v1';
function load(){
  try{
    var raw=localStorage.getItem(KEY);
    if(raw){var o=JSON.parse(raw);if(o&&typeof o==='object')return o}
  }catch(e){}
  return null;
}
function persist(){
  try{localStorage.setItem(KEY,JSON.stringify({game:G,hist:HIST}))}
  catch(e){showToast('Salvataggio non riuscito: memoria piena')}
}
writeGame=function(g){G=g;persist();render();return Promise.resolve()};
writeHist=function(entries){HIST=entries;persist();render();return Promise.resolve()};

// -- init --------------------------------------------------
DBREADY=true;
var saved=load();
G=(saved&&saved.game)||blankGame([]);
if(!G.players)G.players=[];
G.players.forEach(function(p){if(!p.frames)p.frames=emptyFrames()});
// partite salvate prima dell'annulla illimitato
if(!G.undos)G.undos=G.undo?[G.undo]:[];
delete G.undo;
HIST=(saved&&saved.hist)||[];
try{MYNAME=localStorage.getItem('score_name')||null}catch(e){}
setConn(true,'Su questo dispositivo');
render();

// -- ponte per il livello di sincronizzazione (vedi in fondo alla pagina) --
window.SCORE={
  get G(){return G}, get HIST(){return HIST},
  writeGame:function(g){return writeGame(g)},
  writeHist:function(h){return writeHist(h)},
  me:function(){return MYNAME},
  toast:function(m){showToast(m)},
  chatOn:function(sendFn){CHAT_ON=true;CHAT_SEND=sendFn;paintBadge()},
  setChat:function(list){
    CHAT=list||[];
    var wasBottom=(window.innerHeight+window.scrollY>=document.body.scrollHeight-80);
    render();
    if(NAV==='chat'&&wasBottom)window.scrollTo(0,document.body.scrollHeight);
  },
  apply:function(game,hist){
    if(game){
      G=game;
      if(!G.players)G.players=[];
      G.players.forEach(function(p){if(!p.frames)p.frames=emptyFrames()});
      if(!G.undos)G.undos=G.undo?[G.undo]:[];
      delete G.undo;
    }
    if(hist)HIST=hist;
    persist();render();
  }
};
// le chiamate interne passano dal ponte, così la sincronizzazione le intercetta
var _wg=writeGame,_wh=writeHist;
writeGame=function(g){return window.SCORE.writeGame(g)};
writeHist=function(h){return window.SCORE.writeHist(h)};
window.SCORE.writeGame=function(g){return _wg(g)};
window.SCORE.writeHist=function(h){return _wh(h)};

if('serviceWorker' in navigator){
  window.addEventListener('load',function(){
    navigator.serviceWorker.register('./sw.js').catch(function(){});
  });
}

<script type="module">
// ── sincronizzazione fra dispositivi (facoltativa) ──────────────────────
// Attiva solo se firebase-config.js contiene una configurazione.
// Senza, l'app resta locale e questo blocco non fa nulla.

const cfg = window.FIREBASE_CONFIG;
const bar = document.getElementById('syncbar');

function showBar(html){
  bar.innerHTML = '<div class="sb">' + html + '</div>';
  bar.dataset.ready = '1';
  // la barra vive sulla home; nelle sezioni resta nascosta
  bar.style.display = document.body.classList.contains('home') ? '' : 'none';
}

// Codice partita: dall'indirizzo (#stanza) o generato e ricordato.
function roomId(){
  const m = location.hash.match(/^#([A-Za-z0-9_-]{4,32})$/);
  if (m) { try { localStorage.setItem('score_room', m[1]); } catch(e){} return m[1]; }
  let r = null;
  try { r = localStorage.getItem('score_room'); } catch(e){}
  if (!r) {
    r = Math.random().toString(36).slice(2, 8).toUpperCase();
    try { localStorage.setItem('score_room', r); } catch(e){}
  }
  return r;
}

if (cfg && cfg.projectId) {
  const ROOM = roomId();
  const link = location.origin + location.pathname + '#' + ROOM;
  showBar('Partita <b>' + ROOM + '</b><button class="btn" id="sbcopy">Copia invito</button>');
  document.getElementById('sbcopy').onclick = async () => {
    const b = document.getElementById('sbcopy');
    try { await navigator.clipboard.writeText(link); b.textContent = 'Copiato'; }
    catch(e) { prompt('Copia questo link:', link); return; }
    setTimeout(() => { b.textContent = 'Copia invito'; }, 1800);
  };

  try {
    const { initializeApp } = await import('https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js');
    const { getFirestore, doc, onSnapshot, setDoc,
            collection, addDoc, query, orderBy, limit, serverTimestamp } =
      await import('https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js');

    const db  = getFirestore(initializeApp(cfg));
    const ref = doc(db, 'rooms', ROOM);

    // Firestore rifiuta gli array annidati e la partita ne ha tre livelli
    // (giocatori -> frame -> tiri), quindi lo stato viaggia come testo JSON.
    let applying = false;   // sto scrivendo io? allora non rimbalzare
    let lastSent = null;

    function push(){
      const payload = JSON.stringify({ game: window.SCORE.G, hist: window.SCORE.HIST });
      if (payload === lastSent) return;
      lastSent = payload;
      setDoc(ref, { data: payload, updatedAt: Date.now() })
        .catch(() => showBar('Partita <b>' + ROOM + '</b> · salvataggio non riuscito'));
    }

    // Le due cuciture che il livello locale già usa: ora salvano anche online.
    const localGame = window.SCORE.writeGame;
    const localHist = window.SCORE.writeHist;
    window.SCORE.writeGame = g => { localGame(g); if (!applying) push(); return Promise.resolve(); };
    window.SCORE.writeHist = h => { localHist(h); if (!applying) push(); return Promise.resolve(); };

    onSnapshot(ref, snap => {
      if (!snap.exists()) { push(); return; }          // prima volta: semina
      const raw = snap.data().data;
      if (typeof raw !== 'string' || raw === lastSent) return;
      let incoming;
      try { incoming = JSON.parse(raw); } catch(e) { return; }
      lastSent = raw;
      applying = true;
      try { window.SCORE.apply(incoming.game, incoming.hist); } finally { applying = false; }
    }, () => showBar('Partita <b>' + ROOM + '</b> · sincronizzazione interrotta'));

    // -- chat: un documento per messaggio, dentro la stanza --------------
    const msgs = collection(ref, 'messages');

    window.SCORE.chatOn(text => {
      addDoc(msgs, {
        name: (window.SCORE.me && window.SCORE.me()) || 'Anonimo',
        text: String(text).slice(0, 300),
        at: Date.now(),
        ts: serverTimestamp()
      }).catch(() => window.SCORE.toast && window.SCORE.toast('Messaggio non inviato'));
    });

    // gli ultimi 100, riordinati dal piu vecchio al piu recente
    onSnapshot(query(msgs, orderBy('at', 'desc'), limit(100)), snap => {
      const list = [];
      snap.forEach(d => {
        const m = d.data();
        if (m && typeof m.text === 'string' && typeof m.name === 'string' && typeof m.at === 'number')
          list.push({ name: m.name, text: m.text, at: m.at });
      });
      list.sort((a, b) => a.at - b.at);
      window.SCORE.setChat(list);
    }, () => {});

  } catch (e) {
    showBar('Partita <b>' + ROOM + '</b> · offline, i punteggi restano su questo telefono');
  }
}
</script>
